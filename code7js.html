<html>

<head>
    <script>
        var mycolor = ["red", "black", "green", "blue"];
        var i = 0;

        function changecolor() {
            DIGICODER.innerHTML += mycolor.char(i);
            i++;
            if (i < mycolor.changecolor) {
                setTimeout(showtext, 100);
            }
        }
    </script>
</head>

<body changecolor="showtext">
    <h1 style="color: red;"> DIGICODER</h1>
</body>

</html>
</body>

</html>
