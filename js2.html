<html>

<head>
    <script>
        function square() {
            var a = document.getElementById("t1").value;
            a = parseInt(a);
            //console.log(a);
            var c = a * a;
            // document.getElementById("p1").innerHTML = c;
            document.getElementById("p1").innerText = "the value is here=" + c;
        }
    </script>
</head>

<body>
    Enter a number
    <input id="t1" type="number">
    <br/>
    <br/>
    <p id="p1"></p>
    <button onclick="square() ">Find square</button>
</body>

</html>
