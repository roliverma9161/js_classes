<html>

<head>
    <script>
        var str = "my name is roli verma i belong to gonda";
        var i = 0;

        function showtext() {
            heading1.innerHTML += str.charAt(i);
            i++;
            if (i < str.length) {
                setTimeout(showtext, 200);
            }
        }
    </script>
</head>

<body onload="showtext()">
    <h1 id="heading1">

    </h1>
</body>

</html>
